<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Varco</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="page">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 6 L4 6 L4 26 L9 26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M23 6 L28 6 L28 26 L23 26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          <rect x="14.5" y="11" width="3" height="10" rx="1.5" fill="var(--color-accent)" />
        </svg>
        <h1>Varco</h1>
      </div>
      <div class="card">
        <div id="dropzone" class="dropzone">
          <svg class="dz-icon" width="30" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 6 L4 6 L4 26 L9 26" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M23 6 L28 6 L28 26 L23 26" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="dz-text" id="dz-text">Trascina un file qui, o clicca per selezionarlo</span>
        </div>
        <input type="file" id="file-input" hidden />

        <div class="field" style="margin-top: 1rem">
          <label for="expires-input">Scadenza (giorni)</label>
          <input type="number" id="expires-input" value="7" min="1" />
        </div>

        <div class="field">
          <label for="max-downloads-input">Numero massimo di download (opzionale)</label>
          <input type="number" id="max-downloads-input" min="1" placeholder="illimitati" />
        </div>

        <button id="upload-button" disabled>Carica</button>
        <progress id="progress-bar" value="0" max="100" hidden></progress>
        <p id="message" class="message"></p>
      </div>

      <div id="result-panel" class="card" hidden>
        <div class="result-row">
          <span class="stub-label">link</span>
          <code id="download-url"></code>
          <button id="copy-link" class="secondary">Copia link</button>
        </div>
        <div class="result-row">
          <span class="stub-label">password</span>
          <code id="password"></code>
          <button id="copy-password" class="secondary">Copia password</button>
        </div>
        <button id="copy-both">Copia entrambi</button>
      </div>
    </div>
    <script type="module" src="/upload.js"></script>
  </body>
</html>
