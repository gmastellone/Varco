<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Varco — Admin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="page">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 6 L4 6 L4 26 L9 26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M23 6 L28 6 L28 26 L23 26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          <rect x="14.5" y="11" width="3" height="10" rx="1.5" fill="var(--color-accent)" />
        </svg>
        <h1>Genera invito</h1>
      </div>
      <div class="card">
        <form id="invite-form">
          <div class="field">
            <label for="label-input">Etichetta</label>
            <input type="text" id="label-input" required placeholder="es. Mario" />
          </div>
          <div class="field">
            <label for="max-files-input">Numero massimo di file</label>
            <input type="number" id="max-files-input" min="1" value="1" required />
          </div>
          <div class="field">
            <label for="ttl-input">Validità (ore)</label>
            <input type="number" id="ttl-input" min="1" value="48" required />
          </div>
          <button id="submit-button" type="submit">Genera invito</button>
        </form>
        <p id="message" class="message"></p>
      </div>

      <div id="result-panel" class="card" hidden>
        <div class="result-row">
          <span class="stub-label">invito</span>
          <code id="invite-url"></code>
          <button id="copy-url" class="secondary">Copia</button>
        </div>
      </div>
    </div>
    <script type="module" src="/admin.js"></script>
  </body>
</html>
